<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Future of Jobs app icon. Original art: three peaks of the jobs landscape
       in the app's AI Exposure band colours (src/config/theme.ts
       RISK_BAND_COLORS) on the app's dark ground (gray-900 #101828, fog #0a0e17).
       Full-bleed square: iOS and Android cut their own corners.
       public/icons/icon-maskable.svg is the same art inside the 80% safe zone.
       PNGs: node scripts/build_icons.mjs -->
  <defs>
    <radialGradient id="ground" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1b2a40"/>
      <stop offset="0.55" stop-color="#101828"/>
      <stop offset="1" stop-color="#0a0e17"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#ground)"/>
  <g id="peaks">
    <!-- back: amber, the tallest -->
    <polygon points="256,112 128,384 256,384" fill="#f59e0b"/>
    <polygon points="256,112 384,384 256,384" fill="#b45309"/>
    <!-- front left: green -->
    <polygon points="164,228 52,384 164,384" fill="#22c55e"/>
    <polygon points="164,228 276,384 164,384" fill="#15803d"/>
    <!-- front right: red -->
    <polygon points="352,196 236,384 352,384" fill="#ef4444"/>
    <polygon points="352,196 460,384 352,384" fill="#b91c1c"/>
    <!-- ground line, the app's cyan -->
    <rect x="36" y="384" width="440" height="14" rx="7" fill="#06b6d4"/>
  </g>
</svg>
